# Publishes a GitHub release when a v* tag is pushed: the plugin ZIP the README points to, the six
# liquid-glass study ZIPs with their checksums (built here from examples/, not stored in the tree),
# and the release notes taken from plugin.json. The tag must match plugin.json's version.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts and the reference library
        run: |
          python3 -B -m unittest discover -s tests
          python3 -B skills/research/scripts/corpus.py verify
      - name: Package the plugin and the study downloads
        run: bash .github/package.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "Shaders for TouchDesigner $version" \
            --notes "$(jq -r '.extensions["com.openai"].publication.release_notes' plugin.json)"
