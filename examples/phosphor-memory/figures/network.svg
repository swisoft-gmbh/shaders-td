<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><title>Phosphor Memory native network schematic</title><rect width="100%" height="100%" fill="#101827"/><g font-family="system-ui" fill="#ecf2ff"><text x="28" y="32" font-size="20">Phosphor Memory · logical network (schematic)</text><rect x="28" y="60" width="230" height="60" rx="8" fill="#1c3248" stroke="#5b83e8"/><text x="42" y="84" font-size="16">source</text><text x="42" y="105" font-size="12" fill="#9cbbdc">glslTOP</text><text x="280" y="84" font-size="14">Native pixel pass</text><text x="280" y="106" font-size="12" fill="#a4c8dc"></text><rect x="28" y="145" width="230" height="60" rx="8" fill="#1c3248" stroke="#5b83e8"/><text x="42" y="169" font-size="16">seed</text><text x="42" y="190" font-size="12" fill="#9cbbdc">constantTOP</text><text x="280" y="169" font-size="14">Uninitialized zero state</text><text x="280" y="191" font-size="12" fill="#a4c8dc"></text><rect x="28" y="230" width="230" height="60" rx="8" fill="#1c3248" stroke="#5b83e8"/><text x="42" y="254" font-size="16">history</text><text x="42" y="275" font-size="12" fill="#9cbbdc">feedbackTOP</text><text x="280" y="254" font-size="14">Previous state; alpha marks validity</text><text x="280" y="276" font-size="12" fill="#a4c8dc">input 0 ← seed · top → state (previous frame)</text><rect x="28" y="315" width="230" height="60" rx="8" fill="#1c3248" stroke="#5b83e8"/><text x="42" y="339" font-size="16">state</text><text x="42" y="360" font-size="12" fill="#9cbbdc">glslTOP</text><text x="280" y="339" font-size="14">Native pixel pass</text><text x="280" y="361" font-size="12" fill="#a4c8dc">input 0 ← source · input 1 ← history</text><rect x="28" y="400" width="230" height="60" rx="8" fill="#1c3248" stroke="#5b83e8"/><text x="42" y="424" font-size="16">display</text><text x="42" y="445" font-size="12" fill="#9cbbdc">glslTOP</text><text x="280" y="424" font-size="14">Native pixel pass</text><text x="280" y="446" font-size="12" fill="#a4c8dc">input 0 ← source · input 1 ← state</text><rect x="28" y="485" width="230" height="60" rx="8" fill="#1c3248" stroke="#5b83e8"/><text x="42" y="509" font-size="16">out</text><text x="42" y="530" font-size="12" fill="#9cbbdc">outTOP</text><text x="280" y="509" font-size="14">Final style or diagnostic</text><text x="280" y="531" font-size="12" fill="#a4c8dc">input 0 ← display</text></g></svg>