<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Helvetica, Arial, sans-serif">
  <title>Liquid Glass Prism network schematic</title>
  <defs>
    <marker id="wire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9dde3"/>
    </marker>
    <marker id="ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb3d5"/>
    </marker>
    <marker id="opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8a65d"/>
    </marker>
  </defs>
  <rect width="1180" height="700" fill="#14161a"/>
  <text x="30" y="40" fill="#eef0f3" font-size="22" font-weight="bold">Liquid Glass Prism: how the pieces connect</text>
  <text x="30" y="64" fill="#9aa1ab" font-size="14">Schematic of the recipe in study.json (node names as built), not a captured TouchDesigner network.</text>

  <!-- inputs -->
  <rect x="30" y="100" width="290" height="78" rx="8" fill="#1e2630" stroke="#7fb3d5"/>
  <text x="46" y="128" fill="#eef0f3" font-size="17" font-weight="bold">Refraction TOP</text>
  <text x="46" y="150" fill="#b8c0ca" font-size="13">Your scene rendered without the glass,</text>
  <text x="46" y="167" fill="#b8c0ca" font-size="13">same camera. Demo: demo_backdrop</text>

  <rect x="30" y="200" width="290" height="78" rx="8" fill="#1e2630" stroke="#7fb3d5"/>
  <text x="46" y="228" fill="#eef0f3" font-size="17" font-weight="bold">Reflection TOP</text>
  <text x="46" y="250" fill="#b8c0ca" font-size="13">360 panorama, or any image (flat mode).</text>
  <text x="46" y="267" fill="#b8c0ca" font-size="13">Demo: demo_env. Empty: built-in studio</text>

  <rect x="30" y="300" width="290" height="132" rx="8" fill="#2a2219" stroke="#e8a65d" stroke-dasharray="6 4"/>
  <text x="46" y="328" fill="#eef0f3" font-size="17" font-weight="bold">render_back (optional)</text>
  <text x="46" y="350" fill="#d9c3a6" font-size="13">Render TOP, RGBA 32-bit float, 1 buffer.</text>
  <text x="46" y="367" fill="#d9c3a6" font-size="13">Draws Glass geometry from Camera with</text>
  <text x="46" y="384" fill="#d9c3a6" font-size="13">material_back (front faces culled):</text>
  <text x="46" y="401" fill="#f0c98f" font-size="13">rgb = far side's outward normal</text>
  <text x="46" y="418" fill="#f0c98f" font-size="13">alpha = minus eye distance (glass &lt; 0)</text>

  <rect x="30" y="454" width="290" height="72" rx="8" fill="#1e2630" stroke="#59606b"/>
  <text x="46" y="478" fill="#eef0f3" font-size="15" font-weight="bold">blank</text>
  <text x="46" y="498" fill="#b8c0ca" font-size="13">4x4 transparent Constant TOP,</text>
  <text x="46" y="515" fill="#b8c0ca" font-size="13">read by any sampler left empty</text>

  <!-- material -->
  <rect x="390" y="100" width="330" height="330" rx="10" fill="#22303d" stroke="#d9dde3" stroke-width="1.5"/>
  <text x="408" y="130" fill="#eef0f3" font-size="19" font-weight="bold">material</text>
  <text x="408" y="150" fill="#b8c0ca" font-size="13">GLSL MAT (liquid_prism.vert / .frag)</text>
  <text x="408" y="168" fill="#b8c0ca" font-size="13">Your scene: a Render Pass TOP's Override Material.</text>
  <text x="408" y="196" fill="#eef0f3" font-size="14">sRefraction, sReflection</text>
  <text x="408" y="216" fill="#e8a65d" font-size="14">sBackface (only while Back-face pass is on)</text>
  <text x="408" y="246" fill="#eef0f3" font-size="14" font-weight="bold">Per pixel, per slice of the spectrum:</text>
  <text x="408" y="268" fill="#b8c0ca" font-size="13">1. enter: refract() with 1 / n</text>
  <text x="408" y="288" fill="#b8c0ca" font-size="13">2. find the exit: measured (back pass)</text>
  <text x="426" y="306" fill="#b8c0ca" font-size="13">or estimated (ball + Exit tilt)</text>
  <text x="408" y="326" fill="#b8c0ca" font-size="13">3. leave: Snell's law + Fresnel share;</text>
  <text x="426" y="344" fill="#b8c0ca" font-size="13">total internal reflection past critical</text>
  <text x="408" y="364" fill="#b8c0ca" font-size="13">4. read the scene Scene depth further on;</text>
  <text x="426" y="382" fill="#b8c0ca" font-size="13">trapped light: one bounce</text>
  <text x="408" y="402" fill="#b8c0ca" font-size="13">5. + caustic glow, tint, reflection, rim</text>

  <rect x="390" y="454" width="330" height="76" rx="8" fill="#2a2219" stroke="#e8a65d" stroke-dasharray="6 4"/>
  <text x="408" y="480" fill="#eef0f3" font-size="15" font-weight="bold">material_back</text>
  <text x="408" y="500" fill="#d9c3a6" font-size="13">Same shader files, pass = 1: writes normal</text>
  <text x="408" y="517" fill="#d9c3a6" font-size="13">and distance only. Blending off.</text>

  <!-- presets -->
  <rect x="390" y="552" width="330" height="108" rx="8" fill="#1e2630" stroke="#59606b"/>
  <text x="408" y="578" fill="#eef0f3" font-size="15" font-weight="bold">presets_data, presets, preset_exec</text>
  <text x="408" y="598" fill="#b8c0ca" font-size="13">Preset menu copies a look into the parameters.</text>
  <text x="408" y="616" fill="#b8c0ca" font-size="13">Morph blends every look uniform toward</text>
  <text x="408" y="634" fill="#b8c0ca" font-size="13">preset B inside the uniform expressions.</text>
  <text x="408" y="652" fill="#b8c0ca" font-size="13">16 vec4 uniforms reach both materials.</text>

  <!-- outputs (demo) -->
  <rect x="820" y="100" width="330" height="96" rx="8" fill="#1e2630" stroke="#59606b"/>
  <text x="836" y="128" fill="#eef0f3" font-size="17" font-weight="bold">demo_geo (torus) + demo_cam</text>
  <text x="836" y="150" fill="#b8c0ca" font-size="13">Torus SOP, scaled 0.6 along its axis.</text>
  <text x="836" y="167" fill="#b8c0ca" font-size="13">Camera on +Z. Rotation: presets.spin().</text>
  <text x="836" y="184" fill="#b8c0ca" font-size="13">The glass reaches it through render.</text>

  <rect x="820" y="230" width="330" height="70" rx="8" fill="#1e2630" stroke="#d9dde3"/>
  <text x="836" y="258" fill="#eef0f3" font-size="17" font-weight="bold">render</text>
  <text x="836" y="280" fill="#b8c0ca" font-size="13">Glass only (Override Material), Dither off</text>

  <rect x="820" y="330" width="330" height="62" rx="8" fill="#1e2630" stroke="#d9dde3"/>
  <text x="836" y="358" fill="#eef0f3" font-size="17" font-weight="bold">behind</text>
  <text x="836" y="378" fill="#b8c0ca" font-size="13">Select TOP: whatever the Refraction TOP is</text>

  <rect x="820" y="430" width="150" height="56" rx="8" fill="#1e2630" stroke="#d9dde3"/>
  <text x="836" y="464" fill="#eef0f3" font-size="17" font-weight="bold">over</text>
  <rect x="1030" y="430" width="120" height="56" rx="8" fill="#1e2630" stroke="#d9dde3"/>
  <text x="1046" y="464" fill="#eef0f3" font-size="17" font-weight="bold">out</text>

  <!-- wires: images (solid) -->
  <path d="M820 270 C 770 300 770 440 818 456" stroke="#d9dde3" stroke-width="2" fill="none" marker-end="url(#wire)"/>
  <text x="736" y="380" fill="#9aa1ab" font-size="12">input 0</text>
  <path d="M930 392 L 870 430" stroke="#d9dde3" stroke-width="2" fill="none" marker-end="url(#wire)"/>
  <text x="870" y="418" fill="#9aa1ab" font-size="12">input 1</text>
  <path d="M970 458 L 1028 458" stroke="#d9dde3" stroke-width="2" fill="none" marker-end="url(#wire)"/>

  <!-- references (dashed) -->
  <path d="M320 139 L 388 196" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ref)"/>
  <path d="M320 239 L 388 204" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ref)"/>
  <path d="M320 366 L 388 216" stroke="#e8a65d" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#opt)"/>
  <path d="M390 492 Q 340 470 300 432" stroke="#e8a65d" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#opt)"/>
  <text x="300" y="462" fill="#e8a65d" font-size="12">overridemat</text>
  <path d="M720 262 L 818 262" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ref)"/>
  <text x="732" y="254" fill="#7fb3d5" font-size="12">overridemat</text>
  <path d="M985 196 L 985 228" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ref)"/>
  <text x="993" y="218" fill="#7fb3d5" font-size="12">camera, geometry</text>
  <path d="M555 552 L 555 432" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ref)"/>
  
  <!-- legend -->
  <line x1="820" y1="560" x2="860" y2="560" stroke="#d9dde3" stroke-width="2"/>
  <text x="870" y="565" fill="#b8c0ca" font-size="13">image wire (same frame)</text>
  <line x1="820" y1="590" x2="860" y2="590" stroke="#7fb3d5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="870" y="595" fill="#b8c0ca" font-size="13">parameter reference (sampler, material, camera)</text>
  <line x1="820" y1="620" x2="860" y2="620" stroke="#e8a65d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="870" y="625" fill="#b8c0ca" font-size="13">optional back-face pass (Inputs page)</text>
  <text x="820" y="655" fill="#9aa1ab" font-size="12">No previous-frame references: the network has no feedback.</text>
</svg>
